name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  board-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create required dirs
        run: mkdir -p ~/Documents/pina ~/shrimp-ai

      - name: Board smoke test
        run: bun pina-board/verify.ts
