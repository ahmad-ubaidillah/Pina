name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  board-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Symlink repo into expected homedir paths
        run: |
          mkdir -p ~/Documents
          ln -sfn $GITHUB_WORKSPACE ~/Documents/pina
          mkdir -p ~/shrimp-ai

      - name: Board smoke test
        run: bun pina-board/verify.ts
