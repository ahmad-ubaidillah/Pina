<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pina</title>
<style>
  :root{--ink:#111;--muted:#6b7280;--line:#e5e7eb;--green:#16a34a;--blue:#146ef5;--red:#dc2626;--bg:#fff;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  a{color:var(--blue)}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line)}
  header .logo{font-weight:700;letter-spacing:-.02em}
  header select,header input{font:inherit;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:#fff;color:var(--ink)}
  header .spacer{margin-left:auto}
  .tabs{display:flex;gap:2px}
  .tab{padding:5px 12px;border:1px solid transparent;border-radius:6px;cursor:pointer;color:var(--muted);font-size:13px}
  .tab.active{background:var(--ink);color:#fff}
  .btn{font:inherit;font-size:12px;padding:5px 10px;border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:6px;cursor:pointer}
  .btn:hover{background:var(--ink);color:#fff}
  .btn.green{border-color:var(--green);color:var(--green)} .btn.green:hover{background:var(--green);color:#fff}
  .btn.red{border-color:var(--red);color:var(--red)} .btn.red:hover{background:var(--red);color:#fff}
  .btn.sm{padding:3px 8px;font-size:11px}
  .view{padding:16px}
  .hidden{display:none}
  /* board */
  .board{display:flex;gap:10px;overflow-x:auto;align-items:flex-start}
  .col{min-width:210px;width:210px;background:#fafafa;border:1px solid var(--line);border-radius:8px}
  .col h3{margin:0;padding:9px 11px;font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--line)}
  .dot{width:8px;height:8px;border-radius:50%}
  .cnt{margin-left:auto;color:var(--muted);font-weight:400}
  .cards{padding:8px;display:flex;flex-direction:column;gap:6px;min-height:30px}
  .card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 9px;cursor:grab;font-size:13px}
  .card:active{cursor:grabbing}
  .card.drag-over{outline:2px dashed var(--green)}
  .badge{display:inline-block;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:0 6px;margin-top:5px;margin-right:4px}
  .empty{color:#cbd5e1;font-size:11px;text-align:center;padding:6px}
  .taskbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
  .taskbar input{flex:1;max-width:380px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;font:inherit}
  /* sidebar panels */
  .layout{display:flex;gap:14px;align-items:flex-start}
  .main{flex:1;min-width:0}
  .side{width:300px;flex:0 0 auto;display:flex;flex-direction:column;gap:10px}
  .panel{border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:#fafafa}
  .panel h2{margin:0 0 8px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;border-bottom:1px dashed #eef2f7}
  .row:last-child{border-bottom:0}
  .k{color:var(--muted)}
  .chatlog{height:200px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px;font-size:12px;white-space:pre-wrap;margin:6px 0}
  .chatlog .me{color:var(--blue);font-weight:600}
  .git{font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.5;white-space:pre;background:#0d0d0d;color:#cbd5e1;padding:10px;border-radius:8px;max-height:340px;overflow:auto}
  textarea,input.long{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;margin:4px 0}
  .field{margin:10px 0}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
  .ok{color:var(--green)} .warn{color:#b45309}
  footer{color:var(--muted);font-size:11px;padding:8px 16px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <span class="logo">Pina</span>
  <select id="projSel"></select>
  <button class="btn sm" id="addProj">+ Project</button>
  <span class="spacer"></span>
  <div class="tabs">
    <span class="tab active" data-tab="board">Board</span>
    <span class="tab" data-tab="git">Git</span>
    <span class="tab" data-tab="skills">Skills</span>
    <span class="tab" data-tab="settings">Settings</span>
  </div>
</header>

<div id="view-board" class="view">
  <div class="taskbar">
    <input id="newTask" placeholder="tambah task (Enter)" />
    <button class="btn sm" id="undoBtn">Undo</button>
  </div>
  <div class="layout">
    <div class="main">
      <div class="board" id="board"></div>
    </div>
    <div class="side">
      <div class="panel" id="agent"><h2>Agent</h2><div id="agentBody">…</div></div>
      <div class="panel" id="swarm"><h2>Swarm</h2><div id="swarmBody">…</div></div>
      <div class="panel" id="chat"><h2>Chat</h2><div class="chatlog" id="chatLog"></div>
        <input id="chatInput" class="long" placeholder="pesan (Enter)" />
        <div style="display:flex;gap:6px"><button class="btn sm" id="chatSend">Kirim</button>
        <select id="chatRole" class="long" style="flex:1"><option value="">(no role)</option><option>fe</option><option>be</option><option>qa</option><option>pm</option><option>ba</option><option>devops</option><option>cybersec</option><option>uiux</option><option>techwriter</option><option>data</option><option>ml</option><option>mobile</option><option>sre</option><option>growth</option><option>legal</option></select></div>
        <button class="btn sm" id="chatClear">Clear</button>
      </div>
      <div class="panel" id="memory"><h2>Memory</h2><button class="btn sm" id="memRefresh">Refresh</button><div id="memBody" style="margin-top:6px;font-size:11px"></div></div>
      <div class="panel" id="delegate"><h2>Delegate</h2>
        <div style="font-size:11px;color:var(--muted);margin-bottom:4px">tiap baris = 1 worker: <code>role: prompt</code></div>
        <textarea id="delInput" rows="4" placeholder="fe: komponen button&#10;be: endpoint /users"></textarea>
        <button class="btn green sm" id="delRun">Run parallel</button>
        <div id="delOut" style="margin-top:6px;font-size:11px;white-space:pre-wrap"></div>
      </div>
    </div>
  </div>
</div>

<div id="view-git" class="view hidden">
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
    <button class="btn sm" id="gitRefresh">Refresh</button>
    <label class="btn sm"><input type="checkbox" id="gitAll" checked /> all</label>
    <span id="gitPath" style="color:var(--muted);font-size:12px"></span>
  </div>
  <div class="git" id="gitLog">pilih project…</div>
  <div id="gitRestoreMsg" style="margin-top:8px;font-size:12px"></div>
</div>

<div id="view-skills" class="view hidden" style="max-width:760px">
  <h2 style="font-size:15px">Skill Store</h2>
  <div id="skillsList" style="display:flex;flex-direction:column;gap:8px"></div>
</div>

<div id="view-settings" class="view hidden" style="max-width:640px">
  <h2 style="font-size:15px">Settings</h2>
  <div class="field"><label>Heartbeat (autonomous loop)</label>
    <label><input type="checkbox" id="hbEnabled" /> enabled</label>
    <input id="hbInterval" class="long" style="max-width:200px" placeholder="interval detik" />
  </div>
  <div class="field"><label>Gateway — Telegram</label>
    <label><input type="checkbox" id="tgEnabled" /> enabled</label>
    <input id="tgToken" class="long" placeholder="bot token" />
    <input id="tgChat" class="long" placeholder="chat id" />
  </div>
  <div class="field"><label>Cron (JSON array)</label>
    <textarea id="cronList" rows="4" placeholder='[{"at":"0 9 * * *","action":"goal","arg":"ci daily"}]'></textarea>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" id="saveSettings">Save</button>
    <button class="btn green sm" id="runCron">Run first cron</button>
    <button class="btn green sm" id="testHeartbeat">Test heartbeat</button>
    <button class="btn green sm" id="verifyToken">Verify token</button>
    <span id="settingsMsg"></span>
  </div>
</div>

<footer>per-project · kanban tersimpan · git-tree + restore · settings · web/search/browser/delegate</footer>

<script>
const STATES=[],COLORS={}; let curProject="default";
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

async function loadProjects(){
  const d=await (await fetch("/api/projects")).json();
  $("#projSel").innerHTML=`<option value="default">default</option>`+d.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");
  $("#projSel").value=curProject;
}
async function switchProject(p){curProject=p;await Promise.all([loadBoard(),loadGit()]);}

let board=$("#board");
async function loadBoard(){
  const d=await (await fetch("/api/board?project="+encodeURIComponent(curProject))).json();
  STATES.length=0;STATES.push(...d.states);Object.assign(COLORS,d.colors);
  board.innerHTML="";
  for(const s of d.states){
    const col=document.createElement("div");col.className="col";col.dataset.state=s;
    const items=d.columns[s]||[];
    col.innerHTML=`<h3><span class="dot" style="background:${d.colors[s]}"></span>${s}<span class="cnt">${items.length}</span></h3><div class="cards" data-state="${s}"></div>`;
    const cards=col.querySelector(".cards");
    if(!items.length)cards.innerHTML=`<div class="empty">kosong</div>`;
    for(const t of items)cards.appendChild(card(t));
    board.appendChild(col);
  }
}
function card(t){
  const el=document.createElement("div");el.className="card";el.draggable=true;el.dataset.id=t.id;el.dataset.source=t.source||"local";
  let meta="";if(t.agent)meta+=`<span class="badge">${esc(t.agent)}</span>`;if(t.retries>0)meta+=`<span class="badge">retry ${t.retries}</span>`;if(t.source==="mcp")meta+=`<span class="badge">mcp</span>`;
  el.innerHTML=`<div>${esc(t.title)}</div>${meta}`;
  el.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",JSON.stringify({id:t.id,source:t.source||"local"})));
  el.addEventListener("dblclick",async()=>{await fetch("/api/launch",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({prompt:t.title,project:curProject})});});
  return el;
}
board.addEventListener("dragover",e=>{if(e.target.closest(".cards"))e.preventDefault();});
board.addEventListener("drop",async e=>{const cards=e.target.closest(".cards");if(!cards)return;e.preventDefault();let data;try{data=JSON.parse(e.dataTransfer.getData("text/plain"));}catch{return;}
  if(data.source==="local"&&typeof data.id==="number"){await fetch("/api/move",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id:data.id,state:cards.dataset.state,project:curProject})});loadBoard();}});
$("#newTask").addEventListener("keydown",async e=>{if(e.key!=="Enter")return;const v=e.target.value.trim();if(!v)return;await fetch("/api/add",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({title:v,project:curProject})});e.target.value="";loadBoard();});
$("#undoBtn").addEventListener("click",async()=>{await fetch("/api/undo",{method:"POST"});loadBoard();});
$("#projSel").addEventListener("change",e=>switchProject(e.target.value));
$("#addProj").addEventListener("click",async()=>{const name=prompt("Nama project?");if(!name)return;const path=prompt("Path folder (git repo)?",homedir()+"/Documents");if(!path)return;
  const r=await fetch("/api/projects",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name,path})});const j=await r.json().catch(()=>({}));
  if(j.ok){await loadProjects();curProject=j.id;$("#projSel").value=j.id;switchProject(j.id);}else alert(j.error||"gagal");});

async function loadAgent(){const el=$("#agentBody");let d;try{d=await (await fetch("/api/agent")).json();}catch{el.textContent="offline";return;}
  if(!d.ok||!d.session){el.textContent="offline";return;}const s=d.session,st=d.stats;
  let h=`ctx: <b class="${s.context_pressure==="High"?"warn":"ok"}">${esc(s.context_pressure||"-")}</b><br>cmds: ${s.command_count??0}<br>tokens saved: ${s.tokens_saved??0}`;
  if(st&&st.periods){const at=st.periods.find(p=>p.label==="all_time")||st.periods.at(-1);if(at)h+=`<br>savings: ${at.savings_pct.toFixed(1)}%`;}
  el.innerHTML=h;}
async function loadSwarm(){try{const d=await (await fetch("/api/swarm-state")).json();if(!d.ok)return;const st=d.state;
  $("#swarmBody").innerHTML=`<input id="goalInput" class="long" placeholder="goal…"/><button class="btn sm" id="setGoal">Set</button>
   <div style="margin-top:6px"><button class="btn sm" id="autoOn">Auto on</button><button class="btn sm" id="autoOff">Auto off</button></div>
   <input id="budgetInput" class="long" placeholder="budget turns"/>
   <div style="margin-top:6px;font-size:12px">goal: <b>${st.goal?esc(st.goal):"-"}</b><br>auto: <b>${st.autonomous?"ON":"OFF"}</b>${st.budgetTurns?` (${st.budgetTurns})`:""}<br>lessons: ${st.refinements}</div>`;
  $("#setGoal").onclick=async()=>{await fetch("/api/swarm",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"goal",arg:$("#goalInput").value.trim(),project:curProject})});loadSwarm();};
  $("#autoOn").onclick=async()=>{await fetch("/api/swarm",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"autonomous",arg:"on",budget:Number($("#budgetInput").value)||0,project:curProject})});loadSwarm();};
  $("#autoOff").onclick=async()=>{await fetch("/api/swarm",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"autonomous",arg:"off",project:curProject})});loadSwarm();};
}catch{}}
function appendChat(text,who){const d=document.createElement("div");if(who==="me")d.className="me";d.textContent=(who==="me"?"› ":"")+text;$("#chatLog").appendChild(d);$("#chatLog").scrollTop=$("#chatLog").scrollHeight;}
async function sendChat(){const msg=$("#chatInput").value.trim();if(!msg)return;$("#chatInput").value="";appendChat(msg,"me");
  const log=document.createElement("div");$("#chatLog").appendChild(log);
  try{const resp=await fetch("/api/chat",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({message:msg,project:curProject,role:$("#chatRole").value})});
    const reader=resp.body.getReader();const dec=new TextDecoder();let buf="";
    while(true){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value);const lines=buf.split("\n\n");buf=lines.pop();
      for(const ln of lines){if(ln.startsWith("data: ")){try{const j=JSON.parse(ln.slice(6));if(j.t)log.textContent+=j.t;}catch{}}}}}catch(e){log.textContent+="\n[err "+e.message+"]";}}
$("#chatSend").onclick=sendChat;$("#chatClear").onclick=()=>{$("#chatLog").innerHTML="";};
$("#chatInput").addEventListener("keydown",e=>{if(e.key==="Enter")sendChat();});
async function loadMemory(){const b=$("#memBody");b.innerHTML="memuat…";try{const d=await (await fetch("/api/memory")).json();if(!d.ok){b.textContent="offline";return;}
  let h="";const sec=(t,items)=>{if(!items)return"";const a=Array.isArray(items)?items:[items];if(!a.length)return`<div style="color:var(--muted)">${t}: -</div>`;return`<div style="color:var(--muted);margin-top:4px">${t} (${a.length})</div>`+a.slice(0,6).map(x=>`<div>${esc(typeof x==="string"?x:JSON.stringify(x)).slice(0,160)}</div>`).join("");};
  h+=sec("query",d.query);h+=sec("engram",d.engram);h+=sec("patterns",d.patterns);b.innerHTML=h||"-";}catch{b.textContent="err";}}
$("#memRefresh").onclick=loadMemory;
$("#delRun").onclick=async()=>{const raw=$("#delInput").value.trim();if(!raw){$("#delOut").textContent="kosong";return;}
  const tasks=raw.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(\w+):\s*(.*)$/);if(m&&ROLES.includes(m[1]))return{role:m[1],prompt:m[2]};return{prompt:l};});
  $("#delOut").textContent="running "+tasks.length+"…";
  const r=await fetch("/api/chat",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({message:`Use delegate_tasks with: ${JSON.stringify(tasks)}. Return combined results.`,project:curProject})});
  const reader=r.body.getReader();const dec=new TextDecoder();let buf="";const out=$("#delOut");
  while(true){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value);const lines=buf.split("\n\n");buf=lines.pop();for(const ln of lines){if(ln.startsWith("data: ")){try{const j=JSON.parse(ln.slice(6));if(j.t)out.textContent+=j.t;}catch{}}}}}
const ROLES=["fe","be","qa","pm","ba","devops","cybersec","uiux","techwriter","data","ml","mobile","sre","growth","legal"];

async function loadGit(){if(curProject==="default")$("#gitPath").textContent="default = pina-core";else{const ps=await (await fetch("/api/projects")).json();const p=ps.find(x=>x.id===curProject);$("#gitPath").textContent=p?p.path:"";}
  const all=$("#gitAll").checked?"1":"0";const r=await fetch(`/api/projects/${curProject}/gitlog?all=${all}`).then(x=>x.json()).catch(()=>({ok:false}));
  if(!r.ok||!r.text){$("#gitLog").textContent=r.error||"(bukan git repo)";return;}$("#gitLog").textContent=r.text;}
$("#gitRefresh").onclick=loadGit;$("#gitAll").onchange=loadGit;
$("#gitLog").addEventListener("click",async e=>{const line=window.getSelection().toString().trim();const m=line.match(/([0-9a-f]{7,40})/);if(!m)return;const commit=m[1];
  if(!confirm("Branch baru dari "+commit.slice(0,8)+"? (aman)"))return;
  const r=await fetch(`/api/projects/${curProject}/restore`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({commit})});const j=await r.json().catch(()=>({}));
  $("#gitRestoreMsg").innerHTML=j.ok?`<span class="ok">✓ ${esc(j.branch)}</span>`:`<span class="warn">✗ ${esc(j.error||"gagal")}</span>`;loadGit();});

async function loadSettings(){const s=await (await fetch("/api/settings")).json();
  $("#hbEnabled").checked=!!s.heartbeat?.enabled;$("#hbInterval").value=s.heartbeat?.intervalSec??30;
  $("#tgEnabled").checked=!!s.gateway?.telegram?.enabled;$("#tgToken").value=s.gateway?.telegram?.token??"";$("#tgChat").value=s.gateway?.telegram?.chatId??"";
  $("#cronList").value=JSON.stringify(s.cron??[],null,0);}
$("#saveSettings").onclick=async()=>{const s={heartbeat:{enabled:$("#hbEnabled").checked,intervalSec:Number($("#hbInterval").value)||30},gateway:{telegram:{enabled:$("#tgEnabled").checked,token:$("#tgToken").value,chatId:$("#tgChat").value}},cron:safeParse($("#cronList").value,[])};
  const r=await fetch("/api/settings",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(s)});$("#settingsMsg").textContent=r.ok?"saved ✓":"gagal";};
$("#runCron").onclick=async()=>{const r=await fetch("/api/cron/run",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({index:0,project:curProject})});const j=await r.json().catch(()=>({}));$("#settingsMsg").textContent=j.ok?("cron ✓ pid "+j.pid):("✗ "+(j.error||""));};
$("#testHeartbeat").onclick=async()=>{$("#settingsMsg").textContent="running…";const r=await fetch("/api/heartbeat",{method:"POST"});const j=await r.json().catch(()=>({}));$("#settingsMsg").textContent=j.ok?("✓ "+esc((j.output||"").slice(0,60))):"✗";};
$("#verifyToken").onclick=async()=>{const tok=$("#tgToken").value.trim();if(!tok){$("#settingsMsg").textContent="token kosong";return;}$("#settingsMsg").textContent="checking…";
  const r=await fetch("/api/telegram/test",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({token:tok})});const j=await r.json().catch(()=>({}));$("#settingsMsg").textContent=j.ok?("✓ @"+j.username):("✗ "+(j.error||"invalid"));};
function safeParse(t,fb){try{return JSON.parse(t);}catch{return fb;}}

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");
  const v=t.dataset.tab;$("#view-board").classList.toggle("hidden",v!=="board");$("#view-git").classList.toggle("hidden",v!=="git");$("#view-skills").classList.toggle("hidden",v!=="skills");$("#view-settings").classList.toggle("hidden",v!=="settings");
  if(v==="git")loadGit();if(v==="settings")loadSettings();if(v==="skills")loadSkills();});

async function loadSkills(){const el=$("#skillsList");el.innerHTML="memuat…";try{const d=await (await fetch("/api/skills")).json();if(!d.ok){el.textContent="err";return;}
  el.innerHTML=d.skills.map(s=>`<div class="panel" style="display:flex;align-items:center;gap:10px"><div style="flex:1"><div style="font-weight:600">${esc(s.name)} <span class="badge">${s.id}</span></div><div style="font-size:12px;color:var(--muted)">${esc(s.desc)} · ${(s.tags||[]).join(",")}</div></div><label class="btn sm ${s.enabled?"green":""}"><input type="checkbox" data-sk="${s.id}" ${s.enabled?"checked":""}/> ${s.enabled?"on":"off"}</label></div>`).join("");
  el.querySelectorAll("input[data-sk]").forEach(cb=>cb.onchange=async()=>{const id=cb.dataset.sk;cb.parentElement.classList.toggle("green",cb.checked);cb.parentElement.lastChild.textContent=cb.checked?" on":" off";await fetch("/api/skills",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id,enabled:cb.checked})});});
}catch{el.textContent="err";}}

loadProjects().then(()=>{loadBoard();loadGit();});
loadAgent();loadSwarm();loadMemory();
setInterval(loadBoard,3000);setInterval(loadAgent,5000);setInterval(loadSwarm,5000);
</script>
</body>
</html>
